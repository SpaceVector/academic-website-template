{% assign path_segments = page.url | split: '/' %}
{% assign is_zh = path_segments[1] == 'zh' %}

<nav class="navbar sticky-top navbar-expand-md navbar-dark bg-primary">
    <a class="navbar-brand" href="{{ site.url }}{{ site.baseurl }}/">
        {{ site.title | escape }}
    </a>
    
    <!-- 导航栏折叠按钮 -->
    <button class="toggler navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- 导航项容器 -->
    <div class="collapse navbar-collapse" id="navbarColor02">
        <div class="navbar-nav mr-auto">
            <!-- 动态生成导航链接 -->
                <a class="nav-item nav-link" 
                    data-navlink 
                    href="{% if is_zh %}/zh/{% else %}/{% endif %}"
                    data-raw="/"
                    data-en="Home"
                    data-zh="首页">
                    {% if is_zh %}首页{% else %}Home{% endif %}
                </a>
            {% for page in site.nav_pages %}
            <a class="nav-item nav-link" 
                data-navlink
                href="{% if is_zh %}/zh/{{ page.name }}{% else %}/{{ page.name }}{% endif %}"
                data-raw="/{{ page.name }}"
                data-en="{{ page.name | capitalize }}"
                data-zh="{{ page.zh_name }}">
                {% if is_zh %}{{ page.zh_name }}{% else %}{{ page.name | capitalize }}{% endif %}
            </a>
            {% endfor %}
        </div>
        
        <!-- 语言切换按钮 -->
        <div class="navbar-nav ms-auto">
            <a class="nav-item nav-link" id="languageToggle" role="button"></a>
        </div>
    </div>
</nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // 通用工具函数
    const pathUtils = {
        normalize: (path) => path.replace(/\/+/g, '/').replace(/\/$/, '') || '/',
        isZH: (path) => path.startsWith('/zh/') || path === '/zh',
        toggleZH: (path) => {
            const cleanPath = pathUtils.normalize(path);
            return pathUtils.isZH(cleanPath) 
                ? cleanPath.replace(/^\/zh(\/|$)/, '/') 
                : `/zh${cleanPath.startsWith('/') ? cleanPath : `/${cleanPath}`}`;
        }
    };

    // 核心控制器
    const languageManager = {
        init() {
            this.bindToggleButton();
            this.rewriteNavigationLinks();
            this.setupHistoryListener();
        },

        bindToggleButton() {
            const toggleBtn = document.getElementById('languageToggle');
            const currentPath = window.location.pathname;
            
            toggleBtn.textContent = pathUtils.isZH(currentPath) ? 'EN' : '中文';
            toggleBtn.addEventListener('click', (e) => {
                e.preventDefault();
                this.handleLanguageToggle();
            });
        },

        handleLanguageToggle() {
            const currentPath = window.location.pathname;
            const newPath = pathUtils.toggleZH(currentPath);
            
            this.rewriteNavigationLinks(true); // 强制预更新链接
            window.location.href = `${newPath}${window.location.search}${window.location.hash}`;
        },

        rewriteNavigationLinks(preemptive = false) {
            const currentPath = window.location.pathname;
            const isZH = preemptive 
                ? !pathUtils.isZH(currentPath)  // 即将切换的状态
                : pathUtils.isZH(currentPath);  // 当前实际状态

            document.querySelectorAll('[data-navlink]').forEach(link => {
                // 更新链接地址
                const rawPath = link.dataset.raw;
                const newPath = isZH 
                    ? `/zh${rawPath === '/' ? '' : rawPath}` 
                    : rawPath;
                link.href = pathUtils.normalize(newPath);

                // 更新链接文本（关键修复点）
                link.textContent = isZH ? link.dataset.zh : link.dataset.en;
            });
        },

        setupHistoryListener() {
            window.addEventListener('popstate', () => {
                this.rewriteNavigationLinks();
                this.bindToggleButton();
            });
        }
    };

    // 初始化
    languageManager.init();
});
</script>
